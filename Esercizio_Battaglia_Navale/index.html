<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Battaglia Navale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Battaglia Navale</h1>
        <p>Trova e affonda tutte le navi!</p>
    </header>

    <main>

        <section id="INFO">
            <p>Tentativi: <span id="tentativi">0</span></p>
            <p>Navi rimaste: <span id="navi-rimaste">0</span></p>
            <p>Tempo: <span id="tempo">0</span> secondi</p>
        </section>

        <section id="msg">
            <p id="risultato">Clicca su una cella per iniziare!</p>
        </section>

        <section id="grid">
        </section>

        <button id="nuova-partita">Nuova partita</button>

    </main>

    <footer>
        <p>Battaglia Navale - Compiti Vacanze</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
