<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti - San Vincenzo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-marine">
            <div class="container">
                <a class="navbar-brand" href="index.html">Visit San Vincenzo</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cosa-vedere.html">Cosa Vedere</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="itinerario.html">Itinerario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contatti.html">Contatti</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <h1 class="text-center mb-4 text-marine">Richiedi Informazioni o Prenota</h1>

        <section class="row justify-content-center">
            <div class="col-md-8">

                <div id="form-alert" class="alert alert-info d-none" role="alert"></div>

                <form id="contact-form" class="bg-light p-4 rounded shadow-sm border border-light">

                    <div class="row mb-3">

                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="nome" class="form-label fw-bold">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>

                        <div class="col-md-6">
                            <label for="cognome" class="form-label fw-bold">Cognome</label>
                            <input type="text" class="form-control" id="cognome" required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="motivo" class="form-label fw-bold">
                            Cosa ti interessa maggiormente?
                        </label>

                        <select class="form-select" id="motivo" required>
                            <option value="">Seleziona un'opzione...</option>
                            <option value="escursione">Escursione in barca (Isole)</option>
                            <option value="spiagge">Info sulle spiagge (Rimigliano)</option>
                            <option value="enogastronomia">Tour enogastronomico</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-marine w-100 btn-lg">
                        Invia Richiesta
                    </button>

                </form>

            </div>
        </section>

    </main>

    <footer class="bg-marine text-center py-3 mt-auto">
        <p>&copy; 2026 Guida Turistica San Vincenzo. Progetto scolastico.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
